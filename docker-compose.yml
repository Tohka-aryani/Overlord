services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: raven
      POSTGRES_DB: darkweb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d darkweb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://raven:raven@db:5432/darkweb
      OLLAMA_BASE_URL: http://192.168.100.140:11434
      OLLAMA_MODEL: llama3.2:latest
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      APIFY_TOR_ACTOR_ID: ${APIFY_TOR_ACTOR_ID:-igolaizola~tor-dark-web-scraper}
      APIFY_TOR_MAX_ITEMS: ${APIFY_TOR_MAX_ITEMS:-10}
      TOR_KEYWORDS_FILE: /app/data/tor-keywords.txt
    volumes:
      - ./data/tor-keywords.txt:/app/data/tor-keywords.txt:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
